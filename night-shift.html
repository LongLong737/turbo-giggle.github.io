:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#040504;color:#a9b8ae;font:15px/1.4 Georgia,"Times New Roman",serif;display:flex;justify-content:center}
#app{width:100%;max-width:680px;padding:12px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-variant-numeric:tabular-nums}
.meter{flex:1;height:8px;margin:0 12px;background:#151a16;border:1px solid #2a332c}
#bar{height:100%;width:0;background:#7a8f7d;transition:width .3s,background .3s}
.feed{position:relative;border:1px solid #2a332c;background:#000}
canvas{display:block;width:100%;height:auto}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
button{flex:1;min-width:0;padding:11px 6px;background:#0e130f;color:#a9b8ae;border:1px solid #2f3b31;font:inherit;cursor:pointer}
button:hover{background:#18201a}button:focus-visible{outline:2px solid #c9d9cc;outline-offset:1px}
button.on{background:#a9b8ae;color:#040504}
.rep button{border-color:#5a2a2a;color:#d3a5a5}.rep button:hover{background:#2a1010}
#msg{min-height:1.4em;font-style:italic;color:#8a9a8e}
.ov{position:absolute;inset:0;background:rgba(2,3,2,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.ov h1{margin:0;font-size:32px;font-weight:normal;letter-spacing:.04em}
.ov p{max-width:420px;margin:0}
.ov button{flex:none;padding:12px 28px}
.hide{display:none}#cams,#vents{position:relative;margin:8px 0 4px;border:1px solid #2a332c;background:#0c0e0d}#cams img,#vents img{display:block;width:100%;height:auto}#maps #vents{margin:0 0 8px}#tools button{flex:none;padding:11px 22px}#cams button,#vents button{position:absolute;transform:translate(-50%,-50%);flex:none;min-width:34px;height:24px;padding:0;font-size:12px;background:#0c0e0d;border:1px solid #6d7d72}#cams button.on,#vents button.on{background:#a9b8ae;color:#040504}#cams button:disabled{opacity:.35;cursor:default}
#app.wide{display:grid;grid-template-columns:640px minmax(0,1fr);column-gap:16px;align-content:start;grid-auto-rows:min-content}#app.wide .top{grid-column:1/3}#app.wide .feed{grid-column:1;grid-row:2}#app.wide #rep{grid-column:1;grid-row:3}#app.wide #tools{grid-column:1;grid-row:4}#app.wide #msg{grid-column:1;grid-row:5}#app.wide #maps{grid-column:2;grid-row:2/6;align-self:start}#app.wide #maps #cams{margin-top:0}.ov h1{letter-spacing:.06em}

/* old security-terminal skin */
body{font:15px/1.4 "Courier New",Courier,monospace;background:#050605;color:#9fd8a4}
.top{border:2px solid #2d3a2e;border-bottom:4px double #2d3a2e;padding:6px 10px;background:#0a0e0a;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-bottom:10px}
#clock::before{content:"Time ";opacity:.6}
.feed{border:8px ridge #50564f;border-radius:10px;background:#000;box-shadow:0 0 0 2px #000,0 6px 18px #000}
canvas{border-radius:3px}
.scan{border-radius:3px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
button{font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.06em;background:#3b3f3a;color:#e0e6dc;border:2px solid;border-color:#8a8f88 #1c1e1b #1c1e1b #8a8f88;border-radius:0;padding:9px 6px}
button:hover{background:#474c46}
button:active{border-color:#1c1e1b #8a8f88 #8a8f88 #1c1e1b;background:#33372f}
button.on{background:#c9cfc3;color:#111;border-color:#1c1e1b #8a8f88 #8a8f88 #1c1e1b}
button:focus-visible{outline:1px dotted #e0e6dc;outline-offset:-5px}
.rep button{background:#4a2b28;color:#f0cfc9;border-color:#9a6a64 #1e0f0d #1e0f0d #9a6a64}
.rep button:hover{background:#593531}
#cams,#vents{border:3px ridge #4a4f4a;background:#0a0c0a}
#cams button,#vents button{min-width:30px;height:22px;padding:0;font-size:12px;letter-spacing:0;background:#d8d3c2;color:#111;border:2px solid;border-color:#f4efe0 #6d6a5e #6d6a5e #f4efe0}
#cams button:hover,#vents button:hover{background:#e8e3d2}
#cams button:active,#vents button:active{transform:translate(-50%,-48%)}
#cams button.on,#vents button.on{background:#1a1d1a;color:#9fd8a4;border-color:#6d6a5e #f4efe0 #f4efe0 #6d6a5e}
#msg{font-style:normal;color:#9fd8a4;min-height:1.5em;border:1px solid #1f2a20;background:#080c08;padding:5px 9px}
#msg:empty{display:none}#msg::before{content:"> ";opacity:.6}
.ov{border:4px double #2d3a2e;background:#040504}
.ov h1{font-weight:normal;font-size:32px;letter-spacing:.18em;text-transform:uppercase;color:#cfe8cf;text-shadow:0 0 6px #3f8f48}
.ov h1 .achievement-stars{display:inline-block;margin-left:12px;color:#e7bf54;font:20px/1 Arial,sans-serif;letter-spacing:.08em;vertical-align:middle;white-space:nowrap;text-shadow:0 0 8px #ca9e3e70}.ov h1::after{content:"_";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ov .tag{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#6f8f73}
.ov p{font-size:14px;line-height:1.55;max-width:460px;text-align:left}
.ov button{flex:none;padding:10px 26px}
html,body{height:100%;overflow:hidden}
#app{position:absolute;left:0;top:0;max-width:none;width:480px;transform-origin:0 0}
.ov .diff{display:flex;gap:6px}.ov .diff button{padding:8px 10px;font-size:12px}
#office{position:fixed;inset:0;background:#070909}#office canvas{width:100%;height:100%;border-radius:0;touch-action:none;cursor:grab}#office canvas:active{cursor:grabbing}
#office::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.6));}
#office-hud{position:fixed;left:24px;right:24px;top:max(20px,env(safe-area-inset-top));display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#c7cdc2;pointer-events:none;z-index:2;text-shadow:0 2px 4px #000}
#office-hud span:nth-child(2){opacity:.65}
#office-hud[hidden]{display:none}
#office-msg{display:block;color:#c8d2c3;margin-bottom:8px;letter-spacing:0}
#office-nav{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));z-index:4;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}body:not(.touch-controls) #office-nav,body:not(.touch-controls) #close-monitor{display:none}
#office-nav button{flex:1 1 25%;padding:11px 8px;background:rgba(25,29,24,.9);border:1px solid #535b50;font-size:11px;min-height:40px}#office-nav button:disabled{opacity:.4;cursor:default}#office-nav button.on{color:#d8e3d3;border-color:#9ba996;background:#30382d}#office-nav #open-laptop,#office-nav #office-flash{flex:1 1 40%}
body:not(.monitor-open) #app{display:none}
#app{display:none;z-index:10;background:#070b08;border:2px solid #3a4438;box-shadow:0 0 0 9999px rgba(0,0,0,.84)}body.monitor-open #office,body.monitor-open #office-hud{visibility:hidden}body.monitor-open #app{display:block}body.monitor-open #app.wide{display:grid}
#attack-view{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none;border-radius:0}#attack-view[hidden]{display:none}
body.monitor-open #app{animation:monitor-enter .09s ease-out}@keyframes monitor-enter{from{opacity:.4}to{opacity:1}}
#close-monitor{position:fixed;right:12px;top:12px;z-index:30;font-size:11px;padding:9px 14px}#close-monitor[hidden],#office-nav[hidden]{display:none}
#game-menu{position:fixed;right:12px;top:62px;z-index:30;background:#101510;border:1px solid #485346;padding:8px;font-size:11px;color:#b5c4b5}#game-menu[hidden]{display:none}#game-menu summary{cursor:pointer;letter-spacing:.06em}#game-menu button{display:block;margin-top:8px;font-size:11px;padding:8px 10px}
#controls-toggle{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:31;padding:5px 7px;border:0;background:#0b100bcc;color:#aab5a6;font:10px "Courier New",monospace;letter-spacing:.04em;text-transform:none}#controls-panel{position:fixed;top:44px;left:12px;z-index:31;width:min(320px,calc(100vw - 24px));box-sizing:border-box;padding:12px 15px;border:1px solid #414b3d;background:#090d09ed;color:#bdc7b8;font:12px/1.9 "Courier New",monospace;white-space:pre-line}#controls-toggle[hidden],#controls-panel[hidden]{display:none}#office-hud span:first-child{transform:translateY(28px)}
body>.ov{position:fixed;z-index:50;inset:0;background:rgba(3,5,4,.83);backdrop-filter:blur(4px);overflow:auto;box-sizing:border-box}body>.ov.hide{display:none}body>.ov p{color:#b9c8b8}body>.ov .tag{margin-bottom:4px}
.webgl-error{position:absolute;top:35%;padding:30px;color:#cbd5c7}

ay:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#111}.notebook-photo figcaption{font:600 20px/1.1 "Night Shift Hand",cursive;color:#4d5547;text-align:center;padding:8px 2px}#notebook-text{min-height:160px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:28px;background:repeating-linear-gradient(transparent 0 27px,rgba(90,79,53,.16) 27px 28px);padding-top:1px}#notebook-text p{margin:0 0 28px}#notebook-save[hidden]{display:none}#notebook-save{margin:0;padding:11px 24px;border-top:1px solid #a89d81;font:11px "Courier New",monospace;color:#505947;background:#c5b99e}@media(max-width:640px){#notebook-layout{display:block}#notebook-tabs{display:grid;grid-template-columns:1fr 1fr;padding:12px;border-right:0;border-bottom:1px solid #82775f;gap:6px}#notebook-tabs button{min-height:44px;padding:8px}#notebook-page{padding:20px}.notebook-photos{gap:12px}#notebook-name{font-size:32px}#notebook-deaths{font-size:22px}#notebook header{padding:12px 18px}}
